        .ai-gen-loading-dots::after {
            content: '...';
            display: inline-block;
            animation: loading-dots 1.5s infinite;
            width: 20px; /* Give it a fixed width */
            text-align: left;
        }
        @keyframes loading-dots {
            0% { content: '.'; }
            33% { content: '..'; }
            66% { content: '...'; }
            100% { content: '.'; }
        }
    </style>

        // refreshFeatherIcons 由 shared-utils.js 提供（defer 加载，模块调用时已就绪）
        (function() {
            try {
                var t = localStorage.getItem('cpydes_theme');
                if (t === 'dark') {
                    document.documentElement.classList.add('dark-mode');
                } else if (t !== 'light') {
                    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                        document.documentElement.classList.add('dark-mode');
                    }
                }
            } catch(e) {}
        })();

<script>
    // Wait for DOM to be ready then init
    document.addEventListener('DOMContentLoaded', function() {
        initAiChat();
        // 对话搜索防抖（150ms），避免每次按键都全量过滤渲染
        if (typeof debounce === 'function' && typeof window.searchChats === 'function') {
            window.searchChats = debounce(window.searchChats, 150);
        }
    });

</script>
